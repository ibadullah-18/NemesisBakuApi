name: Deploy NemesisBaku Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/nemesisbaku/backend
            git pull --no-rebase origin main

            cd /opt/nemesisbaku/backend/NemesisBakuApi
            docker compose -f docker-compose.yml -f docker-compose.osrm.yml config --quiet
            docker compose -f docker-compose.yml -f docker-compose.osrm.yml build api
            docker compose -f docker-compose.yml -f docker-compose.osrm.yml up -d --no-deps api
            docker compose exec -T nginx nginx -s reload

            docker image prune -f